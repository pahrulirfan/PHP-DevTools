name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: Linux (Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: "3.12"   # Ubuntu 24.04, Linux Mint 22
          - os: ubuntu-22.04
            python: "3.10"   # Ubuntu 22.04, Linux Mint 21
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Qt runtime libraries and the PHP CLI (for the PHP syntax checks)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 \
            libdbus-1-3 php-cli
      - name: Install
        run: python -m pip install -e '.[ui,dev]' pytest-github-actions-annotate-failures
      - name: Test
        run: python -m pytest -q

  desktop:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[ui,dev]" pytest-github-actions-annotate-failures
      - name: Unit tests
        run: python -m pytest -q
      - name: Real services (setup, sites, DNS, PHP versions, database, Mailpit, Redis)
        run: python tools/e2e_desktop.py
        timeout-minutes: 40
