[project]
name = "pipanel"
version = "0.1.0"
description = "Herd-like local PHP dev environment manager for Linux Mint"
requires-python = ">=3.10"
dependencies = ["jinja2>=3.1"]

[project.optional-dependencies]
ui = ["PySide6-Essentials>=6.5"]   # QtCore, QtGui, QtWidgets, QtSvg: the full PySide6 adds ~400 MB of unused modules
dev = ["pytest"]

[project.scripts]
pipanel = "pipanel.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pipanel*"]

[tool.setuptools.package-data]
pipanel = ["templates/*", "assets/*", "assets/fonts/*", "ui/style.qss.tmpl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
